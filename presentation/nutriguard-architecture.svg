<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">NutriGuard Egypt System Architecture</title>
  <desc id="description">Layered system architecture showing user channels, secure API, safety and routing, deterministic tools, retrieval, data authority, optional language model layer, and operations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18372b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#176b58"/>
    </marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d86f5d"/>
    </marker>
    <style>
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #18231f; }
      .subtitle { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #68756e; }
      .section { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #176b58; letter-spacing: 2px; }
      .box-title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #18231f; }
      .box-title-light { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .box-copy { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #68756e; }
      .box-copy-light { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #d6eee4; }
      .tiny { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #68756e; }
      .tiny-light { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .lane { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0f4e42; letter-spacing: 1px; }
      .arrow-label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #176b58; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f6f8f5"/>
  <rect x="0" y="0" width="1920" height="14" fill="#176b58"/>
  <text x="92" y="78" class="section">NUTRIGUARD EGYPT</text>
  <text x="92" y="132" class="title">System Architecture</text>
  <text x="92" y="170" class="subtitle">Deterministic nutrition authority with hybrid RAG and a bounded language layer</text>

  <!-- Main request flow -->
  <text x="92" y="225" class="lane">PRIMARY REQUEST FLOW</text>

  <g filter="url(#shadow)">
    <rect x="92" y="248" width="230" height="126" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <circle cx="137" cy="291" r="21" fill="#e3f0eb"/>
    <path d="M127 291h20M137 281v20" stroke="#176b58" stroke-width="3" stroke-linecap="round"/>
    <text x="171" y="289" class="box-title">User Channels</text>
    <text x="116" y="329" class="box-copy">Responsive RTL web chat</text>
    <text x="116" y="351" class="box-copy">Arabic, ar-EG, and English</text>
  </g>

  <path d="M322 311 H380" fill="none" stroke="#176b58" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="248" width="260" height="126" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <rect x="390" y="248" width="8" height="126" rx="4" fill="#176b58"/>
    <text x="422" y="286" class="box-title">Secure HTTP API</text>
    <text x="422" y="315" class="box-copy">POST /api/v1/chat</text>
    <text x="422" y="337" class="box-copy">Zod validation, rate limits,</text>
    <text x="422" y="359" class="box-copy">origins, timeouts, headers</text>
  </g>

  <path d="M650 311 H708" fill="none" stroke="#176b58" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="718" y="230" width="362" height="162" rx="8" fill="#0f4e42"/>
    <text x="750" y="270" class="box-title-light">Safety &amp; Request Integrity</text>
    <text x="750" y="301" class="box-copy-light">1. Medical / emergency precedence</text>
    <text x="750" y="327" class="box-copy-light">2. Prompt injection protection</text>
    <text x="750" y="353" class="box-copy-light">3. Numeric override / unapproved-data block</text>
    <rect x="931" y="365" width="121" height="22" rx="11" fill="#d86f5d"/>
    <text x="991" y="380" text-anchor="middle" class="tiny-light">BEFORE TOOLS</text>
  </g>

  <path d="M1080 311 H1138" fill="none" stroke="#176b58" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1148" y="230" width="330" height="162" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <text x="1180" y="270" class="box-title">Rule-Based Agent Router</text>
    <text x="1180" y="301" class="box-copy">Authoritative intent classification</text>
    <text x="1180" y="327" class="box-copy">LangGraph bounded workflows</text>
    <text x="1180" y="353" class="box-copy">Conversation context and clarification</text>
    <rect x="1180" y="365" width="164" height="22" rx="11" fill="#e3f0eb"/>
    <text x="1262" y="380" text-anchor="middle" class="tiny">DECIDES THE ROUTE</text>
  </g>

  <path d="M1478 311 H1536" fill="none" stroke="#176b58" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1546" y="248" width="282" height="126" rx="8" fill="#176b58"/>
    <text x="1578" y="286" class="box-title-light">Grounded Response</text>
    <text x="1578" y="315" class="box-copy-light">Facts + calculation basis</text>
    <text x="1578" y="337" class="box-copy-light">Status + provenance</text>
    <text x="1578" y="359" class="box-copy-light">No-result or clarification</text>
  </g>

  <!-- Deterministic authority layer -->
  <rect x="92" y="442" width="1320" height="332" rx="10" fill="#eef4ef" stroke="#c9e4d9" stroke-width="2"/>
  <text x="120" y="478" class="lane">DETERMINISTIC APPLICATION AUTHORITY</text>
  <text x="1382" y="478" text-anchor="end" class="tiny">All user-visible nutrition numbers originate here</text>

  <g filter="url(#shadow)">
    <rect x="120" y="510" width="280" height="112" rx="7" fill="#ffffff" stroke="#dce5df"/>
    <text x="146" y="544" class="box-title">Recipe Search</text>
    <text x="146" y="573" class="box-copy">Approved and verified filters</text>
    <text x="146" y="596" class="box-copy">Stable recipe identifiers</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="428" y="510" width="280" height="112" rx="7" fill="#ffffff" stroke="#dce5df"/>
    <text x="454" y="544" class="box-title">Guideline Search</text>
    <text x="454" y="573" class="box-copy">Sourced passages only</text>
    <text x="454" y="596" class="box-copy">Versioned provenance</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="736" y="498" width="330" height="136" rx="7" fill="#176b58"/>
    <text x="764" y="535" class="box-title-light">Nutrition Calculator</text>
    <text x="764" y="565" class="box-copy-light">Resolve ingredients + normalize units</text>
    <text x="764" y="589" class="box-copy-light">Apply profiles, yields, and retention</text>
    <text x="764" y="613" class="box-copy-light">Recipe / serving / per-100-g bases</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1094" y="510" width="290" height="112" rx="7" fill="#ffffff" stroke="#dce5df"/>
    <text x="1120" y="544" class="box-title">Structured Comparison</text>
    <text x="1120" y="573" class="box-copy">Same basis and exact unit</text>
    <text x="1120" y="596" class="box-copy">Approved rules only</text>
  </g>

  <path d="M1313 392 V432 H260 V500" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1313 432 H568 V500" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1313 432 H901 V488" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1313 432 H1239 V500" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1332" y="423" class="arrow-label">tool calls</text>

  <rect x="120" y="662" width="1264" height="82" rx="7" fill="#ffffff" stroke="#dce5df"/>
  <text x="146" y="690" class="section">CALCULATION RULES</text>
  <text x="146" y="720" class="box-copy">Missing remains null  |  food states stay separate  |  arithmetic remains unrounded internally  |  each result carries coverage, assumptions, and trace</text>

  <!-- Optional LLM lane -->
  <rect x="1444" y="442" width="384" height="332" rx="10" fill="#fff7f4" stroke="#efc7bd" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1472" y="478" class="lane" fill="#9f4e40">OPTIONAL LANGUAGE LAYER</text>
  <g filter="url(#shadow)">
    <rect x="1472" y="510" width="328" height="104" rx="7" fill="#ffffff" stroke="#efc7bd"/>
    <text x="1498" y="543" class="box-title">Advisory Classifier</text>
    <text x="1498" y="571" class="box-copy">Cross-checks intent; cannot override</text>
    <text x="1498" y="593" class="box-copy">the rule-based route</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1472" y="636" width="328" height="104" rx="7" fill="#ffffff" stroke="#efc7bd"/>
    <text x="1498" y="669" class="box-title">Grounded Formatter</text>
    <text x="1498" y="697" class="box-copy">May rephrase computed facts only</text>
    <text x="1498" y="719" class="box-copy">Rejected output falls back to template</text>
  </g>
  <path d="M1313 230 V205 H1636 V500" fill="none" stroke="#d86f5d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowCoral)"/>
  <path d="M1636 614 V626" fill="none" stroke="#d86f5d" stroke-width="2.5" marker-end="url(#arrowCoral)"/>
  <path d="M1800 688 H1850 V311 H1838" fill="none" stroke="#d86f5d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowCoral)"/>
  <text x="1472" y="758" class="tiny" fill="#9f4e40">Never calculates · never invents · never writes</text>

  <!-- Data and infrastructure -->
  <text x="92" y="830" class="lane">DATA &amp; INFRASTRUCTURE</text>
  <g filter="url(#shadow)">
    <rect x="92" y="852" width="315" height="134" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <text x="120" y="890" class="box-title">PostgreSQL</text>
    <text x="120" y="919" class="box-copy">Structured recipes and nutrients</text>
    <text x="120" y="942" class="box-copy">Provenance, versions, review records</text>
    <text x="120" y="965" class="box-copy">Constraints preserve data meaning</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="433" y="852" width="315" height="134" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <text x="461" y="890" class="box-title">Qdrant + Embeddings</text>
    <text x="461" y="919" class="box-copy">Recipe and guideline retrieval</text>
    <text x="461" y="942" class="box-copy">Approval and namespace filters</text>
    <text x="461" y="965" class="box-copy">Provider-neutral embedding adapter</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="774" y="852" width="315" height="134" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <text x="802" y="890" class="box-title">Graduation Demo Data</text>
    <text x="802" y="919" class="box-copy">215 candidate Egyptian recipes</text>
    <text x="802" y="942" class="box-copy">Local deterministic retrieval index</text>
    <text x="802" y="965" class="box-copy">Development / test only</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1115" y="852" width="315" height="134" rx="8" fill="#ffffff" stroke="#dce5df" stroke-width="2"/>
    <text x="1143" y="890" class="box-title">Backend Catalog Adapter</text>
    <text x="1143" y="919" class="box-copy">Public Foods and Recipes endpoints</text>
    <text x="1143" y="942" class="box-copy">Schema-validated and timeout-bounded</text>
    <text x="1143" y="965" class="box-copy">Falls back to local demo data</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1456" y="852" width="372" height="134" rx="8" fill="#18231f"/>
    <text x="1484" y="890" class="box-title-light">Operations &amp; Governance</text>
    <text x="1484" y="919" class="box-copy-light">Metrics · privacy-safe logs · Docker</text>
    <text x="1484" y="942" class="box-copy-light">Backup / recovery · incident response</text>
    <text x="1484" y="965" class="box-copy-light">Fail-closed staging and production gates</text>
  </g>

  <path d="M901 634 V805 H250 V842" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M568 622 V805 H590 V842" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M260 622 V805 H931 V842" fill="none" stroke="#176b58" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M400 566 H414" fill="none" stroke="#176b58" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Legend -->
  <rect x="92" y="1025" width="13" height="13" fill="#176b58"/>
  <text x="114" y="1036" class="tiny">Authoritative / deterministic</text>
  <rect x="319" y="1025" width="13" height="13" fill="#ffffff" stroke="#9fb3a7"/>
  <text x="341" y="1036" class="tiny">Application or infrastructure component</text>
  <rect x="665" y="1025" width="13" height="13" fill="#fff7f4" stroke="#d86f5d" stroke-dasharray="3 2"/>
  <text x="687" y="1036" class="tiny">Optional, bounded language behavior</text>
  <text x="1828" y="1036" text-anchor="end" class="tiny">Production data remains approval-gated</text>
</svg>
