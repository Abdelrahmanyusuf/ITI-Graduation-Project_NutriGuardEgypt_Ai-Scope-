services:
  app:
    build: { context: .. }
    image: "nutriguard:${NUTRIGUARD_IMAGE_TAG:?immutable image tag required}"
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: [env/staging.env]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    healthcheck: { test: [CMD, wget, -qO-, "http://127.0.0.1:3000/ready"], interval: 30s, timeout: 5s, retries: 3 }
